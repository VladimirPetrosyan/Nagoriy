# Runs inside the `web` container. Serves the built SPA and proxies /api/
# to the callback-bot service by its Compose service name — Docker's
# internal DNS resolves that name to the container's address on the shared
# compose network, no host-level plumbing needed for it.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://callback-bot:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app — everything else falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
